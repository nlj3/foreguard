[package]
name = "foreguard"
version = "0.5.0"
edition = "2021"
license = "BUSL-1.1"
description = "Preview what your AI agent is about to do — before it does it. A dry-run trust layer for autonomous agents, powered by kedge."
repository = "https://github.com/nlj3/foreguard"
homepage = "https://github.com/nlj3/foreguard"
authors = ["Noel Jackson <noeljacksonjs@gmail.com>"]
keywords = ["ai", "agent", "security", "mcp", "dry-run"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[[bin]]
name = "foreguard"
path = "src/main.rs"

[dependencies]
# Foreguard is *extracted from*, not forked from, kedge — it reuses kedge's
# fail-safe, deny-wins tool classifier as its engine.
kedge-core = "0.3"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["rt", "macros", "process", "io-util", "io-std", "sync"] }

[profile.release]
lto = "thin"
codegen-units = 1
